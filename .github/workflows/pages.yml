# Необязательно: публикует папку public на GitHub Pages, чтобы открыть приложение на iPhone
# без Mac (рендер тогда идёт прямо в браузере телефона, видео никуда не загружается).
# Запускается только вручную: Actions → "Deploy to GitHub Pages" → Run workflow.
# Перед первым запуском: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
